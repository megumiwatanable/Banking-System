services:
  mysql:
    image: mysql:8.4
    container_name: mysql-spring-boot
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: banking_system
      MYSQL_USER: banking
      MYSQL_PASSWORD: banking
      MYSQL_ROOT_PASSWORD: root-local
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: redis-spring-boot
    ports:
      - "6380:6379"
    restart: unless-stopped
volumes:
  mysql-data:
